<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">LumeFlow mark</title>
  <desc id="description">Three luminous vertical signals inside a rounded square.</desc>
  <defs>
    <linearGradient id="frame" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#31e6c0"/>
      <stop offset="1" stop-color="#6d8cff"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="17" fill="#081924" stroke="url(#frame)" stroke-width="2"/>
  <rect x="16" y="32" width="8" height="16" rx="4" fill="#31e6c0" filter="url(#glow)"/>
  <rect x="28" y="14" width="8" height="34" rx="4" fill="#6d8cff" filter="url(#glow)"/>
  <rect x="40" y="23" width="8" height="25" rx="4" fill="#68e59f" filter="url(#glow)"/>
</svg>
